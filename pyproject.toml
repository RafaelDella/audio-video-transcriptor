[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcreve-local"
version = "0.1.0"
description = "Transcricao local de audios longos com Faster-Whisper e uso controlado de memoria"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Contributors" }]
keywords = ["whisper", "speech-to-text", "transcription", "portuguese"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "av>=12,<17",
  "faster-whisper>=1.1,<2",
]

[project.urls]
Repository = "https://github.com/RafaelDella/audio-video-transcriptor"
Issues = "https://github.com/RafaelDella/audio-video-transcriptor/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
gui = ["PySide6>=6.7,<7"]

[project.scripts]
transcreve = "transcreve.cli:main"
transcreve-gui = "transcreve.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
